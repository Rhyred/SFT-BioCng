services:
  postgres:
    image: postgres:16-alpine
    container_name: nicegas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nicegas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mqtt:
    build:
      context: ./mqtt
      dockerfile: Dockerfile
    container_name: nicegas-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - nicegas-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t '$$SYS/nicegas/healthcheck' -n"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nicegas-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - APP_PORT=${APP_PORT:-8000}
      - APP_HOST=0.0.0.0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-nicegas_dev_jwt_secret_change_in_production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AI_PROVIDER=${AI_PROVIDER:-dmr}
      - AI_BASE_URL=${AI_BASE_URL:-http://model-runner.docker.internal/v1}
      - AI_MODEL=${AI_MODEL:-huggingface.co/huggingfacetb/smollm2-1.7b-instruct-gguf:latest}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30.0}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-512}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.2}
      - AI_MODEL_CHAT=${AI_MODEL_CHAT:-}
      - AI_MODEL_ANALYSIS=${AI_MODEL_ANALYSIS:-}
      - AI_MODEL_GENERAL=${AI_MODEL_GENERAL:-}
      - AI_AGENT_MAX_TOOL_ROUNDS=${AI_AGENT_MAX_TOOL_ROUNDS:-5}
    networks:
      - nicegas-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  nicegas-network:
    name: nicegas-network
    driver: bridge

volumes:
  postgres_data:
    name: nicegas-postgres-data
  mqtt_data:
    name: nicegas-mqtt-data
  mqtt_log:
    name: nicegas-mqtt-log
