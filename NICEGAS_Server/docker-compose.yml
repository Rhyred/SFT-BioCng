services:
  postgres:
    image: postgres:16-alpine
    container_name: nicegas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nicegas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mqtt:
    build:
      context: ./mqtt
      dockerfile: Dockerfile
    container_name: nicegas-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - nicegas-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t '$$SYS/nicegas/healthcheck' -n"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nicegas-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - APP_PORT=${APP_PORT:-8000}
      - APP_HOST=0.0.0.0
    networks:
      - nicegas-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  nicegas-network:
    name: nicegas-network
    driver: bridge

volumes:
  postgres_data:
    name: nicegas-postgres-data
  mqtt_data:
    name: nicegas-mqtt-data
  mqtt_log:
    name: nicegas-mqtt-log
